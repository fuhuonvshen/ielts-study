name: Daily News Crawl

on:
  schedule:
    # 14:05 UTC = 22:05 Beijing. Runs late enough that the day's news has
    # all been published, so the file's date matches its contents. Off the
    # top of the hour because GitHub delays scheduled runs most at :00.
    - cron: '5 14 * * *'
  workflow_dispatch:        # Manual trigger

permissions:
  contents: write
  actions: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/daily-crawl/requirements.txt

      - name: Run daily crawl
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/daily-crawl/daily_crawl.py

      - name: Commit generated data
        run: |
          git config user.name "daily-crawl-bot"
          git config user.email "daily-crawl-bot@users.noreply.github.com"
          git add public/data/daily-practice/
          git diff --cached --quiet || git commit -m "chore(daily-practice): update $(date +'%Y-%m-%d')"
          git push

      - name: Trigger deploy
        run: gh workflow run deploy.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
